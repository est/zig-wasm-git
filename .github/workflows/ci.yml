name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig (official tarball)
        run: |
          ARCH=$(uname -m)   # x86_64 / aarch64
          URL="https://ziglang.org/download/0.16.0/zig-${ARCH}-linux-0.16.0.tar.xz"
          echo "downloading $URL"
          curl -fsSL "$URL" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/.zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.zig" --strip-components=1
          echo "$HOME/.zig" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sanity check
        run: zig version
      - name: Build wasm + native
        run: zig build -Doptimize=ReleaseSmall
      - name: Run tests (zig unit + wasm filter + object API e2e)
        run: ./tests/run.sh
      - name: Bundle JS (esbuild, pinned; no repo deps)
        run: |
          npx -y esbuild@0.25.0 src/host/portable.mjs --bundle --format=esm --platform=neutral --outfile=zig-out/bin/zig_wasm_git.portable.mjs
      # NOTE: --platform=neutral doubles as a portability guard — a node:
      # import leaking into the portable chain fails the build here.
      - name: Smoke-test bundle (putMany/getMany parity with src)
        run: |
          node --check zig-out/bin/zig_wasm_git.portable.mjs
          node --input-type=module -e '
            const wasm = "zig-out/bin/zig_wasm_git.wasm";
            const fixed = { time: 1755859200, timezone: "+0000", author: "CI <ci@x>" };
            const shas = new Set();
            for (const p of ["./src/host/portable.mjs", "./zig-out/bin/zig_wasm_git.portable.mjs"]) {
              const mod = await import(p);
              const git = await mod.RemoteGit.open("https://example.invalid/r.git", { wasm });
              const sha = await git.putMany({ "s.txt": "ok" }, "smoke", fixed);
              if (new TextDecoder().decode((await git.getMany(["s.txt"])).get("s.txt")) !== "ok") throw new Error("smoke get failed: " + p);
              shas.add(sha);
            }
            if (shas.size !== 1) throw new Error("bundle parity failed");
            console.log("bundle smoke ok:", [...shas][0].slice(0, 7));
          '
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            zig-out/bin/zig_wasm_git.wasm
            zig-out/bin/zig_wasm_git.portable.mjs
