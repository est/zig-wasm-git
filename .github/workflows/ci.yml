name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig (official tarball)
        run: |
          ARCH=$(uname -m)   # x86_64 / aarch64
          URL="https://ziglang.org/download/0.16.0/zig-${ARCH}-linux-0.16.0.tar.xz"
          echo "downloading $URL"
          curl -fsSL "$URL" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/.zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.zig" --strip-components=1
          echo "$HOME/.zig" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sanity check
        run: zig version
      - name: Build wasm + native
        run: zig build -Doptimize=ReleaseSmall
      - name: Run tests (zig unit + wasm filter + object API e2e)
        run: ./tests/run.sh
      - name: Bundle JS (esbuild, pinned; no repo deps)
        run: |
          npx -y esbuild@0.25.0 src/host/portable.mjs --bundle --format=esm --platform=neutral --outfile=zig-out/bin/zig_wasm_git.portable.mjs
      # NOTE: --platform=neutral doubles as a portability guard — a node:
      # import leaking into the portable chain fails the build here.
      - name: Smoke-test bundle (putMany/getMany parity with src)
        run: |
          node --check zig-out/bin/zig_wasm_git.portable.mjs
          node --input-type=module -e '
            const wasm = "zig-out/bin/zig_wasm_git.wasm";
            const shas = new Set();
            for (const p of ["./src/host/portable.mjs", "./zig-out/bin/zig_wasm_git.portable.mjs"]) {
              const mod = await import(p);
              const git = await mod.RemoteGit.open("https://example.invalid/r.git", { wasm });
              const sha = await git.putMany({ "s.txt": "ok" }, "smoke");
              if (new TextDecoder().decode((await git.getMany(["s.txt"])).get("s.txt")) !== "ok") throw new Error("smoke get failed: " + p);
              shas.add(sha);
            }
            if (shas.size !== 1) throw new Error("bundle parity failed");
            console.log("bundle smoke ok:", [...shas][0].slice(0, 7));
          '
      # The npm tarball is built and installed here, so a broken package fails
      # CI rather than reaching a user: this catches a bad `files` list, a
      # .d.mts that no longer matches the source, or a bundle that cannot find
      # its co-located wasm.
      - name: Build npm package (dist/ + pack)
        run: |
          ./scripts/build-npm.sh
          npm pack --pack-destination tmp
      - name: Install the tarball into a scratch project and use it
        run: |
          mkdir -p tmp/consumer && cd tmp/consumer
          npm init -y >/dev/null && npm pkg set type=module >/dev/null
          npm install ../zig-wasm-git-*.tgz
          cat > smoke.mjs <<'EOF'
          import { RemoteGit, GitError } from "zig-wasm-git";
          // no `wasm` option: must resolve the co-located engine
          const git = await RemoteGit.open("https://example.invalid/r.git");
          const sha = await git.putMany({ "docs/a.md": "# hi" }, "init");
          const got = new TextDecoder().decode((await git.getMany(["docs/a.md"])).get("docs/a.md"));
          if (got !== "# hi") throw new Error("roundtrip failed: " + got);
          if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error("bad sha");
          // a read against an unreachable host must fail loudly, never come
          // back as an empty Map that reads like "no such key"
          const fresh = await RemoteGit.open("https://example.invalid/r.git");
          let code = null, ours = false, kind = null;
          try { await fresh.getMany(["a"]); } catch (e) { code = e.code; kind = e.kind; ours = GitError.is(e); }
          if (!ours || code !== "NETWORK" || kind !== "io") {
            throw new Error("expected a GitError with kind io / code NETWORK, got ours=" + ours + " kind=" + kind + " code=" + code);
          }
          // the error surface must survive packaging: kind first, code for detail
          if (!GitError.isProtocol(new GitError("protocol", "HTTP", "x", { status: 500 }), "HTTP", "NETWORK")) {
            throw new Error("GitError.isProtocol did not match a code in the set");
          }
          // delete roundtrip through the packaged bundle
          await git.removeMany(["docs/a.md"], "drop");
          if (await git.get("docs/a.md") !== null) throw new Error("removeMany failed in packaged bundle");
          console.log("npm tarball smoke ok:", sha.slice(0, 7));
          EOF
          node smoke.mjs
      - name: Typecheck the shipped declarations
        run: |
          npx -y -p typescript@5 tsc --noEmit --strict \
            --target es2022 --module nodenext --moduleResolution nodenext \
            --lib es2022,dom tests/types/smoke.ts
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            zig-out/bin/zig_wasm_git.wasm
            zig-out/bin/zig_wasm_git.portable.mjs
            dist/
