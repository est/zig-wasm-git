name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig (official tarball)
        run: |
          ARCH=$(uname -m)
          URL="https://ziglang.org/download/0.16.0/zig-${ARCH}-linux-0.16.0.tar.xz"
          echo "downloading $URL"
          curl -fsSL "$URL" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/.zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.zig" --strip-components=1
          echo "$HOME/.zig" >> "$GITHUB_PATH"
      - name: Build wasm (ReleaseSmall)
        run: zig build -Doptimize=ReleaseSmall
      - name: Run tests
        run: ./tests/run.sh
      - name: Package + checksum
        id: pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="zig_wasm_git.wasm"
          cp zig-out/bin/zig_wasm_git.wasm "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          SIZE=$(stat -c%s "$OUT")
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          {
            echo "### zig_wasm_git ${GITHUB_REF_NAME}"
            echo ""
            echo "- \`$OUT\` (${SIZE} bytes) — wasm32-freestanding, no libc"
            echo "- Download: \`curl -LO https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/$OUT\`"
            echo "- Verify: \`sha256sum -c $OUT.sha256\`"
          } > body.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: body.md
          files: |
            ${{ steps.pkg.outputs.name }}
            ${{ steps.pkg.outputs.name }}.sha256
